<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1E2140">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
    <title>RaumRadar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        let roomRadarAudioContext;

        function getRoomRadarAudioContext() {
            if (!roomRadarAudioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return null;
                roomRadarAudioContext = new AudioContextClass();
            }
            if (roomRadarAudioContext.state === 'suspended') {
                roomRadarAudioContext.resume();
            }
            return roomRadarAudioContext;
        }

        function playRoomRadarPop() {
            const audioContext = getRoomRadarAudioContext();
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const overtone = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const startTime = audioContext.currentTime;
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(310, startTime);
            oscillator.frequency.exponentialRampToValueAtTime(220, startTime + 0.085);
            overtone.type = 'sine';
            overtone.frequency.setValueAtTime(620, startTime);
            overtone.frequency.exponentialRampToValueAtTime(440, startTime + 0.065);
            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.exponentialRampToValueAtTime(0.035, startTime + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.095);
            oscillator.connect(gain);
            overtone.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start(startTime);
            overtone.start(startTime);
            oscillator.stop(startTime + 0.1);
            overtone.stop(startTime + 0.08);
        }

        function playRoomRadarSweep() {
            const audioContext = getRoomRadarAudioContext();
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const startTime = audioContext.currentTime;
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(180, startTime);
            oscillator.frequency.exponentialRampToValueAtTime(620, startTime + 0.55);
            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.exponentialRampToValueAtTime(0.05, startTime + 0.07);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.62);
            oscillator.connect(gain).connect(audioContext.destination);
            oscillator.start(startTime);
            oscillator.stop(startTime + 0.65);
        }
    </script>
</head>
<body>
    <header>
        <a class="brand" href="{{ url_for('index') }}" aria-label="RaumRadar Startseite">
            <span class="radar brand-radar" aria-hidden="true">
                <span class="radar-sweep"></span>
                <span class="radar-dot radar-dot-one"></span>
                <span class="radar-dot radar-dot-two"></span>
            </span>
            <h1>RaumRadar</h1>
        </a>
        {% if session.get('untis_session') %}
        <nav>
            <a href="{{ url_for('free_rooms') }}">Freie Räume</a>
            <a href="{{ url_for('homework') }}">Hausaufgaben</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
        {% endif %}
    </header>

    <main>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flashes">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
    <script>
        document.addEventListener('click', (event) => {
            const interactiveElement = event.target.closest('button, .room-chip, .refresh-button, nav a');
            if (interactiveElement && !interactiveElement.matches('.login-form button')) {
                playRoomRadarPop();
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js'));
        }
    </script>
</body>
</html>
